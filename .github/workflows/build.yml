# Builds Roda.exe (x64 and ARM64) on GitHub's own machines from the public source.
# Every push to main is built as a check; pushing a tag like v0.1.0 also publishes a release
# with both exes, their SHA-256 sums and build provenance attestations.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # create the release
  id-token: write       # sign the attestation
  attestations: write

jobs:
  # The trimmed FFmpeg (tools/ffmpeg/build.sh), cross-compiled on Linux. Rebuilt only when the
  # script changes; otherwise it comes from the cache.
  ffmpeg:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7

      - id: cache
        uses: actions/cache@v5
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.arch }}-${{ hashFiles('tools/ffmpeg/build.sh') }}

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm meson ninja-build cmake pkg-config autotools-dev >/dev/null
          WORK=$RUNNER_TEMP/ffwork bash tools/ffmpeg/build.sh ${{ matrix.arch }} ffmpeg-out

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.arch }}
          path: ffmpeg-out
          retention-days: 90

  build:
    needs: ffmpeg
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          path: third_party/ffmpeg-bin

      - name: Build
        env:
          ZIG: zig
        run: ./build.sh out all

      - name: Test (CLI conversions over tests/corpus)
        run: bash tests/run_tests.sh out/x64/Roda.exe

      - name: Package (Lite exe, Full zip) and checksum
        id: sum
        run: |
          mkdir -p dist
          for arch in x64 arm64; do
            cp out/$arch/Roda.exe dist/Roda-$arch.exe
            # Full: the same exe, plus PDFium in engines\, the licences and the README.
            full=staging/Roda-$arch
            mkdir -p $full
            cp -r out/$arch/Roda.exe out/$arch/engines licenses README.md THIRD_PARTY.md $full/
            powershell -Command "Compress-Archive -Path '$full\*' -DestinationPath 'dist\Roda-$arch-full.zip' -Force"
          done
          {
            echo "sums<<EOF"
            (cd dist && sha256sum *)
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: Roda
          path: dist/*

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SUMS: ${{ steps.sum.outputs.sums }}
        run: |
          cat > notes.md <<EOF
          ## Which file do I download?

          | | **Full** (recommended) | **Lite** |
          |---|---|---|
          | Most PCs (Intel / AMD) | **Roda-x64-full.zip** | **Roda-x64.exe** |
          | Windows on ARM (Snapdragon) | **Roda-arm64-full.zip** | **Roda-arm64.exe** |
          | How to start | Unzip anywhere, keep the folder together, run Roda.exe | One file: just run it |
          | Size | about 10 MB | about 2 MB |
          | Photos, documents, spreadsheets, ZIP / TAR, subtitles | ✅ | ✅ |
          | **PDFs** (to Word, sign, merge, remove pages…) | ✅ | ❌ |
          | **Audio** (MP3, WAV, FLAC…) | ✅ | ❌ |
          | **Video** (MP4, trim, GIF…) | ✅ | ❌ |

          ## x64 or ARM?
          It depends on the chip inside your PC. **Almost all Windows PCs are x64**; pick ARM only if you're sure.

          - **x64**: PCs with an **Intel** or **AMD** chip. Most desktops and laptops, for example any PC with an
            Intel Core i3 / i5 / i7, Core Ultra, Pentium or Celeron, or an AMD Ryzen or Athlon chip.
          - **ARM**: newer thin laptops with a **Qualcomm Snapdragon** or **Microsoft SQ** chip, for example
            Copilot+ PCs with Snapdragon X Plus or X Elite, Surface Pro X, and Surface Pro 11 or Surface Laptop 7
            with Snapdragon.

          **Check your own PC** (takes 10 seconds):
          1. Press **Windows key + I** to open Settings.
          2. Go to **System → About** (at the bottom of the list).
          3. Under **Device specifications**, look at two lines:
             - **Processor**: *Intel* or *AMD* means x64. *Snapdragon* or *Microsoft SQ* means ARM.
             - **System type**: *x64-based processor* means x64. *ARM-based processor* means ARM.

          Picked the wrong one? Nothing breaks. On an ARM PC the x64 version still runs (Windows translates it,
          a little slower). On an x64 PC the ARM version just won't start: download the x64 one instead.
          No installer and no runtime needed (Windows 10 / 11).

          Built by GitHub Actions from commit ${GITHUB_SHA}. Verify with:
          \`gh attestation verify Roda-x64.exe --repo ${GITHUB_REPOSITORY}\`

          SHA-256:
          \`\`\`
          ${SUMS}
          \`\`\`

          Windows SmartScreen may warn that the app is unrecognised because the exe is not signed:
          choose **More info → Run anyway**.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Roda ${TAG#v}" --notes-file notes.md --generate-notes
          fi
